name: Build and Publish Docker Image

# The container packaging lives in this repository (`deploy/docker`). It used to
# live in `websterwh/gajae-app-docker`, which meant a source change needed a push
# to two repositories before an image existed. The image name is unchanged
# (`ghcr.io/websterwh/gajae-app-docker`) so existing compose files keep working;
# only the repository that produces it moved.
on:
  push:
    branches: [ "main", "feat/remote-cua-companion", "feat/agent-desktop-companion" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Deliberately not ${{ github.repository }}: the package name is part of the
  # deployment contract for anyone already pulling this image.
  IMAGE_NAME: websterwh/gajae-app-docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The image bundles the GJC runtime SDK (`@gajae-code/*`) from the
      # lockfile, and the app owns a source patch pinned to those exact
      # versions (`patches/gjc-sdk-lifecycle`). Report when npm publishes
      # something newer so the pin is never silently stale. This does not move
      # the pin: a bump only applies when that patch is re-ported against the
      # new sources, which is a code change, not a version edit.
      - name: Report newer bundled GJC packages
        run: |
          set -euo pipefail
          {
            echo "### Bundled GJC runtime packages"
            echo ""
            echo "| Package | Bundled | npm latest |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          stale=""
          for name in @gajae-code/coding-agent @gajae-code/agent-core @gajae-code/ai; do
            bundled="$(node -p "require('./server/gjc-runtime-manifest.json').sdkLifecycle.packages['$name'] ?? 'unknown'")"
            latest="$(npm view "$name" version 2>/dev/null || echo unavailable)"
            echo "| \`$name\` | $bundled | $latest |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$latest" != "unavailable" ] && [ "$latest" != "$bundled" ]; then
              stale="$stale $name ($bundled -> $latest)"
            fi
          done
          if [ -n "$stale" ]; then
            echo "::warning title=Newer GJC runtime packages published::${stale}"
            {
              echo ""
              echo "Newer than the bundled pin:${stale}."
              echo "Moving the pin needs \`patches/gjc-sdk-lifecycle\` re-ported against the new"
              echo "sources (its manifest is keyed to exact file digests), then a regenerated"
              echo "\`server/gjc-runtime-manifest.json\` and refreshed third-party notices."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Bundled GJC runtime packages::up to date with npm"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The builder container inherits the host network so its resolver is the
          # runner's own. On the default bridge the build containers got a resolver
          # that could not resolve anything, which broke the very first apt step
          # while registry pulls kept working.
          driver-opts: network=host

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # The companion branch is the deployment line right now: the compose
            # file tracks :latest, so this branch publishes it until it merges.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/agent-desktop-companion' }}
            type=raw,value=remote-cua-companion,enable=${{ github.ref == 'refs/heads/feat/remote-cua-companion' }}
            type=raw,value=agent-desktop-companion,enable=${{ github.ref == 'refs/heads/feat/agent-desktop-companion' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: deploy/docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile still clones the app source instead of copying this
          # checkout: the build needs a clean tree at the exact ref, and it must
          # stay usable when the image is built from elsewhere. In this repo the
          # ref that triggered the run is that ref.
          build-args: |
            APP_SOURCE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
            APP_REPOSITORY=${{ github.server_url }}/${{ github.repository }}.git
            APP_REF=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
