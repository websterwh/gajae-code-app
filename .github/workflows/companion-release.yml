name: Publish CUA Companion

on:
  push:
    branches: [feat/remote-cua-companion]
    paths:
      - companion/**
      - scripts/build-cua-companion.mjs
      - scripts/package-cua-companion-macos.mjs
      - package.json
      - package-lock.json
      - .github/workflows/companion-release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag (for example cua-companion-v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux-windows:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p dist-native && ln -s "$(command -v bun)" dist-native/bun && node scripts/build-cua-companion.mjs linux-x64 linux-arm64 windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: companion-linux-windows
          path: release/companion/*
          if-no-files-found: error

  macos:
    # Bun cross-compiles both architectures and `lipo` merges them into one
    # universal app before `hdiutil` creates the DMG.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/package-cua-companion-macos.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: companion-macos
          path: release/companion/gajae-cua-companion-macos-universal.dmg
          if-no-files-found: error

  publish:
    needs: [linux-windows, macos]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: companion-*
          path: release/companion
          merge-multiple: true
      - run: |
          cd release/companion
          sha256sum gajae-cua-companion-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || format('cua-companion-dev-{0}', github.sha) }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Gajae CUA Companion $TAG" --generate-notes release/companion/*
