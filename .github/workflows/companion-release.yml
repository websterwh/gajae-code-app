name: Publish agent-desktop Companion

on:
  push:
    branches: [feat/agent-desktop-companion]
    paths:
      - companion-rs/**
      - scripts/build-agent-desktop-companion.mjs
      - package.json
      - package-lock.json
      - .github/workflows/companion-release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag (for example agent-desktop-companion-v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Rust cross-compilation needs a matching OS (plus linker) for macOS/
  # Windows targets, so each target builds on its native runner instead of
  # cross-compiling from one box - there is no reliable way to produce a
  # macOS binary from Linux CI without osxcross, and this project has no
  # need to carry that complexity for a release workflow that already has
  # free native runners for every target OS.
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      # dtolnay/rust-toolchain's own target install can no-op when the
      # requested toolchain was already the runner image's default (it takes
      # an "update" path that does not re-apply the targets list), so add
      # the non-native target explicitly rather than relying on that input.
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: node scripts/build-agent-desktop-companion.mjs linux-x64 linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: companion-linux
          path: release/companion-rs/gajae-agent-desktop-companion-linux-*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: node scripts/build-agent-desktop-companion.mjs darwin-x64 darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: companion-macos
          path: release/companion-rs/gajae-agent-desktop-companion-darwin-*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: node scripts/build-agent-desktop-companion.mjs windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: companion-windows
          path: release/companion-rs/gajae-agent-desktop-companion-windows-x64.exe
          if-no-files-found: error

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: companion-*
          path: release/companion-rs
          merge-multiple: true
      - run: |
          cd release/companion-rs
          sha256sum gajae-agent-desktop-companion-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || format('agent-desktop-companion-dev-{0}', github.sha) }}
        run: |
          run: gh release create "$TAG" --target "$GITHUB_SHA" --title "Gajae agent-desktop Companion $TAG" --generate-notes --latest release/companion-rs/*
