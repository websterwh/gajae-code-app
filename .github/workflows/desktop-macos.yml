name: macOS desktop

# No macOS app is published any more: the app is deployed as the Docker image
# (`deploy/docker`, built by `docker-publish.yml`), so an installer lane on every
# push only burned a macOS runner per commit. Like the Linux desktop lane, this
# one is dispatch-only: it still proves that the embedded server payload builds,
# that `src-tauri` is formatted and that its tests pass, when someone asks for it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Build macOS arm64 desktop shell (ad-hoc)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          architecture: arm64

      - name: Check build host
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          case "$(node --version)" in
            v22.*) ;;
            *) echo "Node 22 is required." >&2; exit 1 ;;
          esac
          echo "Desktop source commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup default 1.85.1
          rustup target add aarch64-apple-darwin
          rustc --version

      - name: Seed verified ripgrep install cache
        run: node scripts/release/prime-ripgrep-cache.mjs

      - name: Install dependencies
        run: npm install

      - name: Check product identity
        run: npm run check:identity

      - name: Build and verify embedded macOS server payload
        run: npm run server:payload:macos

      - name: Check Tauri formatting and tests
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          env -u CI cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build ad-hoc Tauri app bundle
        # A pull-request bundle is never shipped through the updater. The mode
        # is explicit because a release build refuses to guess it.
        env:
          GJC_UPDATE_MODE: disabled
        run: env -u CI npm run tauri -- build --bundles app

      - name: Inspect the assembled bundle
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Gajae Code App.app"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/gajae-app-desktop"
          test -x "$APP/Contents/MacOS/gajae-app-server"
          test -d "$APP/Contents/Resources/resources/server-payload"
          codesign --verify --deep --strict "$APP"
          du -sh "$APP" >> "$GITHUB_STEP_SUMMARY"
